# The platform forces sonar.sources=src; declared here for local parity.
sonar.projectKey=light-bee
sonar.projectName=Light Bee
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Plotly.js is a vendored, version-pinned third-party file, not our code.
sonar.exclusions=src/lightbee/web/static/vendor/**
sonar.cpd.exclusions=src/lightbee/web/static/vendor/**
